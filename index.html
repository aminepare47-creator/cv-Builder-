<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#312e81" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="CV Builder Pro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CV Builder Pro" />
    <meta
      name="description"
      content="Créez, personnalisez et exportez votre CV professionnel en ligne : 10 modèles, 8 langues, studio photo et import de CV existant."
    />

    <!-- Logo / icônes (marque identique au site, au favicon et à l'app installée) -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Application web installable (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Partage sur les réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CV Builder Pro" />
    <meta property="og:title" content="CV Builder Pro — Créez votre CV professionnel" />
    <meta
      property="og:description"
      content="10 modèles, 8 langues, studio photo, assistance IA et export PDF. Gratuit, sans inscription, et utilisable hors ligne."
    />
    <!-- URL absolue obligatoire : WhatsApp/Facebook/Telegram/X ignorent les chemins relatifs -->
    <meta property="og:url" content="https://cv-pro-builder.vercel.app/" />
    <meta property="og:image" content="https://cv-pro-builder.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CV Builder Pro — créez un CV professionnel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CV Builder Pro — Créez votre CV professionnel" />
    <meta
      name="twitter:description"
      content="10 modèles, 8 langues, studio photo, assistance IA et export PDF. Gratuit et hors ligne."
    />
    <meta name="twitter:image" content="https://cv-pro-builder.vercel.app/og-image.png" />

    <title>CV Builder Pro — Créez votre CV professionnel</title>
  </head>
  <body>
    <div id="root">
      <!--
        Écran de démarrage statique : visible instantanément à l'ouverture
        (avant même que React ne charge), notamment quand l'app est installée
        et lancée depuis l'écran d'accueil. React remplace ce contenu au montage.
      -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,#1e1b4b,#3730a3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <svg width="88" height="88" viewBox="0 0 512 512" role="img" aria-label="CV Builder Pro">
          <rect width="512" height="512" rx="104" fill="#ffffff" fill-opacity="0.12" />
          <path d="M156 100 H316 L364 148 V392 a24 24 0 0 1 -24 24 H156 a24 24 0 0 1 -24 -24 V124 a24 24 0 0 1 24 -24 Z" fill="#ffffff" />
          <path d="M316 100 L364 148 H336 a20 20 0 0 1 -20 -20 Z" fill="#c7d2fe" />
          <rect x="188" y="180" width="130" height="22" rx="11" fill="#3730a3" />
          <rect x="188" y="214" width="92" height="14" rx="7" fill="#94a3b8" />
          <rect x="188" y="256" width="146" height="14" rx="7" fill="#cbd5e1" />
          <rect x="188" y="282" width="118" height="14" rx="7" fill="#cbd5e1" />
          <rect x="188" y="308" width="146" height="14" rx="7" fill="#e2e8f0" />
          <rect x="188" y="334" width="100" height="14" rx="7" fill="#e2e8f0" />
          <circle cx="372" cy="372" r="54" fill="#f59e0b" stroke="#1e1b4b" stroke-width="10" />
          <path d="M348 372 L364 388 396 352" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div style="text-align:center;">
          <div style="color:#ffffff;font-size:22px;font-weight:800;letter-spacing:-0.01em;">CV Builder Pro</div>
          <div style="color:#c7d2fe;font-size:14px;font-weight:600;margin-top:4px;">Générateur de CV professionnel</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
